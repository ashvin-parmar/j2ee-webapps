<!DOCTYPE HTML>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>MVC Framework</title>
<script src='jquery/jquery.js'></script>
<script>
//Written by Amit [Framework Developer]
var mvcfm={
"model":null
};
function replaceText(node, find, replace) 
{
if(node.nodeType===3) // Node.TEXT_NODE
{ 
node.nodeValue=node.nodeValue.replace(new RegExp(find, 'g'), replace);
}
else
{
for (let child of node.childNodes) replaceText(child, find, replace);
}
}
function triggerBodyStringInterpolation()
{
//alert(mvcfm.model.name);
for(let key in mvcfm.model)
{
let value=mvcfm.model[key];
alert("Key: "+key+", Value: "+value);
//document.body.innerHTML=document.body.innerHTML.replaceAll("{{"+key+"}}",mvcfm.model[key]);   //it will change the complete alloted DOM element
replaceText(document.body,"{{"+key+"}}",mvcfm.model[key]);  //perform DOM manipulation by targeting only the text nodes
}
}
$(()=>{
if(mvcfm.model!=null)
{
$.each(mvcfm.model,function(key,value){
var $elems=$("[mvcfm-attribute="+key+"]");
if($elems.is("input"))
{
var $elemType=$elems.attr('type');
//alert($elems.length+", "+$elemType);
if($elemType=="radio")
{
for(var i=0;i<$elems.length;i++)
{
var $elem=$($elems[i]);
var $elemBindTo=$elem.attr("mvcfm-bind-to") || "value";
//alert($elem.attr($elemBindTo)+", "+value);
if(value==$elem.attr($elemBindTo)) $elem.prop("checked","true");
}
$elems.on('change',(ev)=>{
for(var i=0;i<$elems.length;i++)
{
var $elem=$($elems[i]);
var $elemBindTo=$elem.attr("mvcfm-bind-to") || "value";
if($elem.is(":checked")) mvcfm.model[key]=$elem.attr($elemBindTo);
}
});
}
else if($elemType=="checkbox")
{

$elems.on('change',(ev)=>{
var $elem=$($elems[0]);
var $elemBindTo=$elem.attr("mvcfm-bind-to") || "value";
if(typeof mvcfm.model[key]=="boolean")
{
$elem.prop($elemBindTo,$elem.is(":checked"));
mvcfm.model[key]=$elem.is(":checked");
}
else if(typeof mvcfm.model[key]=="string")
{
mvcfm.model[key]=$elem.is(":checked")?$elem.attr($elemBindTo):"";
}
else if(typeof mvcfm.model[key]=="object")
{
mvcfm.model[key]=[];
for(var i=0;i<$elems.length;i++)
{
$elem=$($elems[i]);
if($elem.is(":checked")) mvcfm.model[key].push($elem.attr($elemBindTo));
}
}
});
}
else
{
$.each($elems,function(index,value2){
var $elem=$(value2);
$elem.prop("value",value);
var $elemBindTo=$elem.prop("mvcfm-bind-to") || "value";
$elem.on('change',(ev)=>{
var $elemBindToValue=$elem.prop("value");
$elem.prop($elemBindTo,$elemBindToValue);
mvcfm.model[key]=$elemBindToValue;
});
});
}
//alert(mvcfm.model[key]);    //On each changes -> it will show up.
}
else if($elems.is("select"))
{
$.each($elems,function(index,value3){
var $elem=$(value3);
var selectedAny=false;
$.each($elem.children("option"),function(index,value4){
var $child=$(value4);
if($child.val()===value) selectedAny=true;
});
if(!selectedAny)
{
$elems.prepend("<option value='-1'> &lt;Select &gt;</option>");
$elem.prop("value","-1");
}
else
{
$elem.prop("value",value);
}
var $elemBindTo=$elem.prop("mvcfm-bind-to") || "value";
$elem.on('change',(ev)=>{
var $elemBindToValue=$elem.prop("value");
$elem.prop($elemBindTo,$elemBindToValue);
mvcfm.model[key]=$elemBindToValue;
});
});
}
});
triggerBodyStringInterpolation();
}
});
</script>
