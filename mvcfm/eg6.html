<!DOCTYPE HTML>

<title>MVC Framework</title>

<script>
//Written by Amit [Framework Developer]
var mvcfm={
"model":null,
"controller":null
};
$(()=>{
testFeat();
let $mvcClickElems=$("[mvcfm-click]");
$.each($mvcClickElems,function(index,value){
let $mvcClickElem=$(value);
$mvcClickElem.on('click',function(ev){
ev.preventDefault();
let funcName=$mvcClickElem.attr("mvcfm-click");
//alert(funcName);
let originalFunc=Reflect.get(mvcfm.controller,funcName);
let resultPromise=Reflect.apply(originalFunc,mvcfm.controller,{});
resultPromise.then((response)=>{
alert(JSON.stringify(response));
},(error)=>{
alert(JSON.stringify(error));
});
});
});

});
function testFeat()
{
let $elems=$("[mvcfm-if]");
$.each($elems,function(index,value){
let $elem=$(value);
let expr=$elem.attr("mvcfm-if");
alert(expr);
let result=eval(expr);
alert(result);
if(result===true)
{
$elem.show('slow');
}
else
{
$elem.hide('fast');
}
});
}
</script>

class Student
{
contructor(rollNumber,name,gender,isIndian,interest,city)
{

class StudentManager
{
constructor()
{
this.students=[];

update(student)
{
return new Promise((resolve,reject)=>{
const xhr=new XMLHttpRequest();
let finalUrl='StudentManager/update';
xhr.open("POST",finalUrl);
xhr.setRequestHeader('Content-Type','application/json');
xhr.onload=()=>{
if(xhr.status>=200 && xhr.status<300)
{
resolve(JSON.parse(xhr.responseText));
}
else
{
var contentType = xhr.getResponseHeader("Content-Type");
var messageData;
if (contentType && contentType.indexOf("application/json") !== -1) 
{
messageData=JSON.parse(xhr.responseText).error;
} 
else if (contentType && contentType.indexOf("text/html") !== -1) 
{
messageData=xhr.responseText;
}
reject({
status:xhr.status,
message:messageData
});
}
};
xhr.onerror=()=>reject(new Error('Network Error'));
const body=JSON.stringify(student);
xhr.send(body);
});
}
