var mvcfm={
_model:null,
controller:null,
interpolationTextNodes:[],
ifElements:[],
attrElements:{}
};

Object.defineProperty(mvcfm,"model",{
get()
{
return this._model;
},
set(newModel)
{
  if(newModel)
  {
    this._model=this.createProxy(newModel);
    const init=()=>{
      this.compile(document.body);
      this.updateAllViews();
    };
    if(document.readyState==="loading")
    {
      document.addEventListener("DOMContentLoaded",init);
    }
    else
    {
      init();
    }
  }
  else
  {
    this._model=null;
  }
}

});

mvcfm.createProxy=function(obj,path="")
{
const self=this;
  if(typeof obj !== "object" || obj===null) return obj;

  if(Array.isArray(obj))
  {
    for(let i=0;i<obj.length;i++)
    {
      if(typeof obj[i]==="object" && obj[i]!==null)
      {
        obj[i]=self.createSD(obj[i],`${path}[${i}]`);
      }
    }
    return new Proxy(obj,{
        get(target, prop, receiver) {
        const value = Reflect.get(target, prop, receiver);
        if (typeof value === 'function' && ['push', 'pop', 'shift', 'unshift', 'splice', 'reverse', 'sort'].includes(prop)) {
          alert(prop);
          alert(value);
          return function(...args) {
            const result = value.apply(target, args);
            self.updateViewsFor(path, target);
            self.updateConditionals();
            return result;
          }
        }
        return value;
      },
      set(target, prop, value, receiver) {
        const result = Reflect.set(target, prop, value, receiver);
        self.updateViewsFor(path, target);
        self.updateConditionals();
        return result;
      }
  });
  }
    for (let key in obj) {
    if (typeof obj[key] === "object" && obj[key] !== null) {
      obj[key] = self.createProxy(obj[key], path ? `${path}.${key}` : key);
    }
  }

  return new Proxy(obj, {
    set(target, property, value, receiver) {
      const oldVal = target[property];
      const result = Reflect.set(target, property, value, receiver);
      if (oldVal !== value) {
        const fullPath = path ? `${path}.${property}` : property;
        self.updateViewsFor(fullPath, value);
        self.updateConditionals();
      }
      return result;
    }
  });

}

mvcfm.compile=function(root)
{
const self=this;

  traverse(self,root);
}

function traverse(self,node)
{

  if(node.nodeType===Node.TEXT_NODE)
  {
    const text=node.nodeValue;
    if(text.includes("{{") && text.includes("}}"))
    {
      node.originalText=text;
      self.interpolationTextNodes.push(node);
    }
  }
  else if(node.nodeType===Node.ELEMENT_NODE)
  {
    const $elem=$(node);
    if($elem.attr("mvcfm-if")!==undefined)
    {
      self.ifElements.push($elem);
    }

    const clickAttr=$elem.attr("mvcfm-click");

    if(clickAttr!==undefined)
    {
      $elem.on("click",(ev)=>{
        ev.preventDefault();
        if(self.controller)
        {
          const func=Reflect.get(self.controller,clickAttr);
          if(typeof func === "function")
          {
            const result=Reflect.apply(func,self.controller,[]);
            if(result && typeof result.then=== 'function')
            {
              result.then(
                (res)=>{
                  if(res) alert("Success: "+JSON.stringify(res));
                },
                (err)=>{
                  if(err) alert("Error: "+JSON.stringify(err));
                }
              );
            }
          }
        }
      });
    }
    const attrKey=$elem.attr("mvcfm-attribute");
    if(attrKey!==undefined)
    {
      if(!self.attrElements[attrKey])
      {
        self.attrElements[attrKey]=[];
      }
      self.attrElements[attrKey].push($elem);
    }

    const bindTo=$elem.attr("mvcfm-bind-to") || "value";
    if($elem.is("input[type='radio']"))
    {
      $elem.on("change",()=>{
        if($elem.is(":checked"))
        {
          self.model[attrKey]=$elem.val() || $elem.attr(bindTo);
        }
      })
    }
    else if($elem.is("input[type='checkbox']"))
    {
      $elem.on("change",()=>{
        const currentVal=self.model[attrKey];
        if(Array.isArray(currentVal))
        {
          const checkedValues=[];
          const group=$("[mvcfm-attribute='"+attrKey+"']");
          group.each(function(){
            const cb=$(this);
            if(cb.is(":checked"))
            {
              checkedValues.push(cb.val() || cb.attr(bindTo));
            }
          });
          self.model[attrKey]=checkedValues;
        }
        else if(typeof currentVal === "boolean")
        {
          self.model[attrKey]=$elem.is(":checked");
        }
        else
        {
          self.model[attrKey]=$elem.is(":checked")?($elem.val() || $elem.attr(bindTo)): "";
        }
      });
    }
    else 
    {
      $elem.on("input chage", ()=>{
        self.model[attrKey]=$elem.val();
      });
    }

    for(let child of node.childNodes)
    {
      traverse(self,child);
    }
  }
}

mvcfm.updateAllViews=function(){
const self=this;  
  if(!self.model) return;
  self.interpolationTextNodes.forEach(node => self.interpolateTextNode(node));
  Object.keys(self.attrElements).forEach(key=>{
    self.updateInputsFor(key,self.model[key]);
  });
  self.updateConditionals();
}

mvcfm.updateViewsFor=function(key,value)
{
const self=this;
  self.interpolationTextNodes.forEach((node)=>{
    if(node.originalText.includes("{{"+key+"}}"))
    {
      self.interpolateTextNode(node);
    }
  });
  self.updateInputsFor(key,value);
};

mvcfm.interpolateTextNode=function(node)
{
const self=this;
  let text=node.originalText;
  const matches=text.match(/\{\{\s*([\w\.]+)\s*\}\}/g);
  if(matches)
  {
    matches.forEach(match=>{
      const propPath=match.replace(/[\{\}\s]/g,"");
      const val=self.resolvePath(self.model,propPath);
      text=text.replace(match,Array.isArray(val)?JSON.stringify(val):(val!==undefined?val:""));
    });
  }
  node.nodeValue=text;
};

mvcfm.resolvePath=function(obj,path){
const parts=path.split(".");
  let current=obj;
  for(let i=0;i<parts.length;i++)
  {
    const part=parts[i];
    if(current!==null && current!==undefined)
    {
      current=current[part];
    }
    else
    {
      return undefined;
    }
  }
  return current;
};


mvcfm.updateInputsFor=function(key,value){
const self=this;
  //alert("Key: "+key+", Value: "+value);
//  if(key !== undefined) return;
  const elements=self.attrElements[key];
  try
  {
  elements.forEach($elem => {
    const bindTo=$elem.attr("mvcfm-bind-to") || "value";
    if($elem.is("input[type='radio']"))
    {
      const elemVal=$elem.val() || $elem.attr(bindTo);
      $elem.prop("checked",String(value)===String(elemVal));
    }
    else if($elem.is("input[type='checkbox']"))
    {
      if(Array.isArray(value))
      {
        const elemVal=$elem.val() || $elem.attr(bindTo);
        $elem.prop("checked",value.includes(elemVal));
      }
      else if(typeof value === "boolean")
      {
        $elem.prop("checked",value);
      }
      else
      {
        const elemVal=$elem.val() || $elem.attr(bindTo);
        $elem.prop("checked",String(value)===String(elemVal));
      }
    }
    else if($elem.is("select"))
    {
      let selectedAny=false;
      $elem.children("option").each(function(){
        if($(this).val()===String(value)) selectedAny=true;
      });
      if(!selectedAny && value!== undefined && value!== "")
      {
        if($elem.find("option[value='-1']").length===0)
        {
          $elem.prepend("<option value='-1' disabled>&lt;Select&gt;</option>");
        }
        $elem.val("-1");
      }
      else
      {
        $elem.val(value);
      }
    }
    else
    {
      $elem.val(value);
    } 
  });
  }catch(e)
  {
  }
};

mvcfm.updateConditionals=function(){
  const self=this;
  self.ifElements.forEach($elem => {
    const expr=$elem.attr("mvcfm-if");
    try
    {
      const keys=Object.keys(self.model || {});
      const values=Object.values(self.model || {});
      const func = new Function(...keys, `return (${expr});`);
      const result=func.apply(null,values);
      if(result)
      {
        $elem.show('slow');
      }
      else 
      {
        $elem.hide('fast');
      }
    }catch(e)
    {
      console.error("Failed to evaluate mvcfm-if: "+expr,e);
    }
  });
};
