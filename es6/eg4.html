<title>ES6 Examples</title>

<script>
function sam(a,b,c)
{
alert(a+","+b+","+c);
}
function doIt1()
{
var a=[10,20,30];
sam(a);
sam(...a);		//Spreading the list based arguments into parameters seperately.
}

<body>
<button onclick='doIt1()'>1.</button>
