<script>
$(()=>{
$("#name").attr("placeHolder","Rohan");
$("#addStudentButton").click(function(ev){
ev.preventDefault();
$("#errorSection").html("");
if(!$("#studentAddForm").valid())
{
return;
}

var rollNumber=$("#rollNumber").val();
var name=$("#name").val();
var student=new Student(rollNumber,name);
//alert(JSON.stringify(student));
var studentManager=new StudentManager();
var addStudPromise=studentManager.addStudent(student);

addStudPromise.then(function(result){
if(result!=null)
{
alert("Servlet Response arrived alongwith result: "+JSON.stringify(result));
}
else
{
alert("Servlet response arrived, but no result arrive");
}
$("#addStudentPanel").load("doneMessage.html");
},function(errorMessage){
$("#errorSection").html(errorMessage);
});
});
});
</script>

<h3 class='ui-widget-header'>Student</h3>
<div id='addStudentPanel' class='ui-widget ui-widget-content'>
<form id='studentAddForm' class='ui-widget ui-widget-content ui-widget-shadow ui-corner-all' style='width:500px;margin:5px;'>
Roll Number: &nbsp;
<input id='rollNumber' name='rollNumber' type='text' class='ui-widget' required><br>
Name: &nbsp;
<input id='name' name='name' type='text' required><br>
<span id='errorSection' style='color:red;'></span><br>
<button type='button' id='addStudentButton'>Add Student</button><br><br>
</form>
<br>
<a class='ui-widget-shadow' href='index.html'>Home</a>
<br>
</div>
