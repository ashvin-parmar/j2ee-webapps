<script>
$(()=>{
var $rowTemplate;
var studentManager=new StudentManager();
var studPromise=studentManager.getStudents();
studPromise.then(function(result){
if(result!=null)
{
var students=result;
$.each(students,function(index,value){
//alert(JSON.stringify(value));
const student=value;
$rowTemplate=$("<tr></tr>");
$("<td>"+(index+1)+"</td>").appendTo($rowTemplate);
$("<td>"+student.rollNumber+"</td>").appendTo($rowTemplate);
$("<td>"+student.name+"</td>").appendTo($rowTemplate);
$rowTemplate.clone().appendTo("#studentsTable tbody");
});
}
},function(errorMessage){
alert("Exception: "+errorMessage);
});
});
</script>


<div id='studentsDataDivision'  class='ui-widget ui-widget-content ui-corner-all'>
<table id='studentsTable' class='ui-widget ui-widget-content ui-corner-all' border='1'>
<thead  class='ui-widget ui-widget-content ui-corner-all'>
<tr  class='ui-widget ui-widget-content ui-corner-tr'>
<th>S.No.</th>
<th>Roll Number</th>
<th>Name</th>
</tr>
</thead>
<tbody>
</tbody>
</table>
<br>
<a class='ui-widget-shadow' href='index.html'>Home</a><br>
</div>
