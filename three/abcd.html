<!DOCTYPE HTML>
<html>
<head>
<meta charset='utf-8'>
<title>My Third Web Application</title>
<script>
function validate(frm)
{
var name=frm.name.value.trim();
if(name.length==0)
{
alert("Name required");
frm.name.focus();
return false;
}
return true;
}
</script>
</head>
<body>
<form action='/three/aaa' onsubmit='return validate(this)'>
Name:
&nbsp; 
<input type='text' id='name' name='name' ><br>
<button type='submit'>Next</button>
</form>
</body>
</html>
