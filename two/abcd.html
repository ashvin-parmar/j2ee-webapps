<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>My Second Web Application</title>
<script>
function validate(frm)
{
var nn=frm.name.value.trim();
if(nn.length==0)
{
alert("Name required");
frm.name.focus();
return false;
}
var a="abcdefghijklmnopqrstuvwxyz-._ ABCDEFGHIJKLMNOPQRSTUVWXYZ";
for(var i=0;i<nn.length;i++)
{
if(a.indexOf(nn.charAt(i))==-1)
{
alert("Invalid name, only alphabets, '.', '-', space and '_' are allowed");
frm.name.focus();
return false;
}
}
return true;
}
</script>
</head>
<body>
<form action='/two/aaa' onsubmit='return validate(this)'>
Name
<input type='text' id='name' name='name'><br>
<button type='submit'>Next</button>
</form>
</body>
</html>
