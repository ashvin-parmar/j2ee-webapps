<!DOCTYPE html>
<html lang='en'>
<head>
<title>AJAX Examples</title>
<meta charset='utf-8'>
<script>
function saveEnquiry()
{
var firstName=document.getElementById("firstName").value.trim();
var lastName=document.getElementById("lastName").value.trim();
var age=document.getElementById("age").value.trim();
var customer={
"firstName":firstName,
"lastName":lastName,
"age":age
};
var dataFirstName=document.getElementById("dataFirstName");
//Var dataLastName=document.getElementById("dataLastName");
var dataAge=document.getElementById("dataAge");
dataFirstName.innerHTML="";
dataLastName.innerHTML="";
dataAge.innerHTML="124";
var xmlHttpRequest=new XMLHttpRequest();
xmlHttpRequest.onreadystatechange=function()
{
if(this.readyState==4)
{
if(this.status==200)
{
var cus=JSON.parse(this.responseText);
//alert(this.responseText);
//alert(cus);
if(cus.firstName!=null) 
{
dataFirstName.innerHTML=cus.firstName;
dataLastName.innerHTML=cus.lastName;
dataAge.innerHTML=cus.age;
}
else
{
alert("Some problem");
}
}
else
{
alert("Some problem");
}
}
};
xmlHttpRequest.open("POST","servletThree",true);
xmlHttpRequest.setRequestHeader("Content-Type","application/json");
xmlHttpRequest.send(JSON.stringify(customer));
}
</script>
</head>
<body>
<h2>Learning POST type request with parameters using java-script</h2>

<table>
<tr>
<td>
First name: 
</td>
<td>
<input type='text' id='firstName' name='firstName' >
</td>
</tr>
<tr>
<td>
Last name: 
</td>
<td>
<input type='text' id='lastName' name='lastName'>
</td>
</tr>
<tr>
<td>
Age: 
</td>
<td>
<input type='number' id='age' name='age'>
</td>
</tr>
<tr>
<td colspan='2' style='text-align:center'>
<button onclick='saveEnquiry()'>Save</button>
</td>
</tr>
</table>
<br>

<span id='dataFirstName'></span><br>
Last name: 
<span id='dataLastName'></span><br>
Age: 
<span id='dataAge'></span><br><br>

</div>

</body>
</html>
