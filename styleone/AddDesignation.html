<!DOCTYPE HTML>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>Style one</title>
<script>
function validateDesignation(frm)
{
var title=frm.title.value.trim();
var titleErrorSection=document.getElementById('titleErrorSection');
titleErrorSection.innerHTML='';
if(title.length==0)
{
titleErrorSection.innerHTML='Required';
frm.title.focus();
return false;
}
return true;
}
function cancelAddition()
{
document.getElementById('cancelAdditionForm').submit();
}
</script>
</head>
<body>
<!-- Main content start here -->
<div style='width:90hw;height:95vh;border:1px solid black'>
<!-- header start here -->
<div style='width:90hw;margin:5px;border:1px solid black'>
<a href='/styleone/index.html'><img src='/styleone/images/hr_nexus_logo.png' style='width:30px;float:left'></a>
<div style='margin:4px;font-size:15pt'>HR-Nexus</div>
</div>
<!-- header ends here -->
<!-- middle content start here -->
<div style='width:90hw;height:72vh;margin:5px;border:1px solid white'>
<!-- left panel start here -->
<div style='height:65vh;margin:5px;padding:5px;float:left;border:1px solid black'>
<b>Designations</b><br>
<a href='/styleone/employeeView' style='float:left'>Employees</a><br><br>
<a href='/styleone/index.html'>Home</a>
</div>
<!-- left panel ends here -->
<!-- right panel start here -->
<div style='height:65vh;margin-left:110px;margin-right:5px;margin-bottom:5px;margin-top:5px;padding:5px;overflow:scroll;border:1px solid black'>
<h2>Designation (Add Module)</h2>
<form action='/styleone/addDesignation' onsubmit='return validateDesignation(this)'>
Designation
&nbsp;
<input type='text' id='title' name='title' maxlength='35' size='36'>
<span id='titleErrorSection' style='color:red'></span><br>
<button type='submit'>Add</button>
<button type='button' onclick='cancelAddition()'>Cancel</button>
</form>
</div>
<!-- right panel ends here -->
</div>
<!-- middle content ends here -->
<!-- footer start here -->
<div style='text-align:center;margin:5px;font-size:10pt;border:1px solid white'>
&copy; HR-Nexus 2025
</div>
<!-- footer ends here -->
</div>
<!-- Main content ends here -->
<form id='cancelAdditionForm' action='/styleone/designationView'>
</form>
</body>
</html>
