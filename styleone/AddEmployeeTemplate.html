<!DOCTYPE HTML>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>HR-Nexus</title>
<script>
function validateDesignation(frm)
{
var firstInvalidComponent=null;
var valid=true;
var name=frm.name.value.trim();
var nameErrorSection=document.getElementById('nameErrorSection');
nameErrorSection.innerHTML='';
if(name.length==0)
{
nameErrorSection.innerHTML='Required';
firstInvalidComponent=frm.name;
valid=false;
}
var designationCode=frm.designationCode.value;
var designationCodeErrorSection=document.getElementById('designationCodeErrorSection');
designationCodeErrorSection.innerHTML='';
if(designationCode==-1)
{
designationCodeErrorSection.innerHTML="Select designation";
if(firstInvalidComponent==null) firstInvalidComponent=frm.designationCode;
valid=false;
}
var dateOfBirth=frm.dateOfBirth.value;
var dateOfBirthErrorSection=document.getElementById('dateOfBirthErrorSection');
dateOfBirthErrorSection.innerHTML='';
if(dateOfBirth.length==0)
{
dateOfBirthErrorSection.innerHTML='Select date of birth';
if(firstInvalidComponent==null) firstInvalidComponent=frm.dateOfBirth;
valid=false;
}
var gender=frm.gender;
var genderErrorSection=document.getElementById('genderErrorSection');
genderErrorSection.innerHTML='';
if(gender[0].checked==false && gender[0].checked==false)
{
genderErrorSection.innerHTML='Select gender';
valid=false;
}
var basicSalary=frm.basicSalary.value;
var basicSalaryErrorSection=document.getElementById('basicSalaryErrorSection');
basicSalaryErrorSection.innerHTML='';
if(basicSalary<=0)
{
basicSalaryErrorSection.innerHTML='Invalid basic salary';
if(firstInvalidComponent==null) firstInvalidComponent=frm.basicSalary;
valid=false;
}
var panNumber=frm.panNumber.value.trim();
var panNumberErrorSection=document.getElementById('panNumberErrorSection');
panNumberErrorSection.innerHTML='';
if(panNumber.length==0)
{
panNumberErrorSection.innerHTML='PAN number required';
if(firstInvalidComponent==null) firstInvalidComponent=frm.panNumber;
valid=false;
}
var aadharCardNumber=frm.aadharCardNumber.value.trim();
var aadharCardNumberErrorSection=document.getElementById('aadharCardNumberErrorSection');
aadharCardNumberErrorSection.innerHTML='';
if(aadharCardNumber.length==0)
{
aadharCardNumberErrorSection.innerHTML='Aadhar card number required';
if(firstInvalidComponent==null) firstInvalidComponent=frm.aadharCardNumber;
valid=false;
}
if(!valid) firstInvalidComponent.focus();
return valid;
}
function cancelAddition()
{
document.getElementById('cancelAdditionForm').submit();
}
</script>
</head>
<body>
<!-- Main content start here -->
<div style='width:90hw;height:95vh;border:1px solid black'>
<!-- header start here -->
<div style='width:90hw;margin:5px;border:1px solid black'>
<a href='/styleone/index.html'><img src='/styleone/images/hr_nexus_logo.png' style='width:30px;float:left'></a>
<div style='margin:4px;font-size:15pt'>HR-Nexus</div>
</div>
<!-- header ends here -->
<!-- middle content start here -->
<div style='width:90hw;height:72vh;margin:5px;border:1px solid white'>
<!-- left panel start here -->
<div style='height:65vh;margin:5px;padding:5px;float:left;border:1px solid black'>
<b>Designations</b><br>
<a href='/styleone/employeeView' style='float:left'>Employees</a><br><br>
<a href='/styleone/index.html'>Home</a>
</div>
<!-- left panel ends here -->
<!-- right panel start here -->
<div style='height:65vh;margin-left:110px;margin-right:5px;margin-bottom:5px;margin-top:5px;padding:5px;overflow:scroll;border:1px solid black'>
<b>Employee (Add Module)</b><br>
<form action='/styleone/addEmployee' onsubmit='return validateDesignation(this)'>
<table>
<tr>
<td><b>Name: </b></td>
<td>
<input type='text' id='name' name='name' maxlength='50' size='51'>
<span id='nameErrorSection' style='color:red'></span>
</td>
</tr>

<tr>
<td><b>Designation: </b></td>
<td>
<select id='designationCode' name='designationCode'>
<option value='-1'>&lt;Select designation&gt;</option>
<option value='1'>Manager</option>
<option value='2'>Clerk</option>
</select>
&nbsp;<span id='designationCodeErrorSection' style='color:red'></span>
</td>
</tr>
<tr>
<td>Date of birth: </td>
<td><input type='date' id='dateOfBirth' name='dateOfBirth'>
<span id='dateOfBirthErrorSection' style='color:red'></span></td>
</tr>
<tr>
<td>Gender: </td>
<td>
<input type='radio' id='male' name='gender' value='M'>Male
&nbsp;&nbsp;
<input type='radio' id='female' name='gender' value='F'>Female
<span id='genderErrorSection' style='color:red'></span>
</td>
</tr>
<tr>
<td>Indian? : </td>
<td>
<input type='checkbox' id='isIndian' name='isIndian'>
</td>
</tr>
<tr>
<td>Basic Salary: </td>
<td>
<input type='number' id='basicSalary' name='basicSalary'>
<span id='basicSalaryErrorSection' style='color:red'></span>
</td>
</tr>

<tr>
<td>PAN number: </td>
<td>
<input type='text' id='panNumber' name='panNumber' maxlength='15' size='16'>
<span id='panNumberErrorSection' style='color:red'></span>
</td>
</tr>
<tr>
<td>Aadhar card number: </td>
<td>
<input type='text' id='aadharCardNumber' name='aadharCardNumber' maxlength='15' size='16'>
<span id='aadharCardNumberErrorSection' style='color:red'></span>
</td>
</tr>
<td colspan='2'>
<button type='submit'>Add</button> &nbsp;&nbsp;
<button type='button' onclick='cancelAddition()'>Cancel</button>
</td>
</table>
</form>
</div>
<!-- right panel ends here -->
</div>
<!-- middle content ends here -->
<!-- footer start here -->
<div style='text-align:center;margin:5px;font-size:10pt;border:1px solid white'>
&copy; HR-Nexus 2025
</div>
<!-- footer ends here -->
</div>
<!-- Main content ends here -->
<form id='cancelAdditionForm' action='/styleone/employeeView'>
</form>
</body>
</html>
