<!-- Event handling: One way to manage propagation-->

<!DOCTYPE HTML>
<html>
<head>
<meta charset='utf-8'>
<title>JQuery Selector Example(s)</title>
<script src='jquery/jquery.js'></script>
<style>
.pqr
{
  background:#628141;
  color:#E5D9B6;
  font-size:40pt;
  font-weight:bold;
}
</style>
<script>
$(()=>{

/*
$("#mainContainer").click(function(){
  alert("main container clicked");  //Over here, if we are click on any element inside the mainContainer then it got called, 
  //To manage this, we have to take a pararmeter in function as 'event'.
});
*/
$("#mainContainer").click(function(ev){ //This is parent most element, no stopPropagation over here.
  if(this==ev.target) alert("main container got clicked");    //one way to trigger only main container
});
$("#childContainer").click(function(ev){
  alert("child container got clicked");
  ev.stopPropagation();
});
$("#lmn").click(function(ev){
  alert("span container got clicked");
  ev.stopPropagation();
});
$("#button5").click(function(ev){
  alert("button 5 got clicked");
  ev.stopPropagation();   //This is stop the propagation of click event to thier parent.
});
});
</script>
</head>
<body>
<div id='mainContainer' >
This is main container<br>
<div id='childContainer' >
This is child container<br>
<span id='lmn'>
This is the button inside the span 'lmn'<br>
<button type='button' id='button5'>(5) Click me</button><br>
</span>
</div>
</div>
--------------------------<br>
</body>
</html>
