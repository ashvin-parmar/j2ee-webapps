<!-- Keyboard Down key example  -->

<!DOCTYPE HTML>
<html>
<head>
<meta charset='utf-8'>
<title>JQuery Example(s)</title>
<script src='jquery/jquery.js'></script>
<style>
.boardStyle
{
background:lightgray;
color:white;
border:1px groove black;
font-size:20pt;
overflow:auto;
}
</style>
<script>
jQuery(($)=>{
$(document).keypress(function(ev){   //Event happening at the time when finger from any key is up -> removed 
  $("#board").append(ev.which+","+ev.key+","+ev.code+"<br>");
 
 /*     //NONE from below, only characters + parenthesis+ ENTER. NOT include CTRL, ARRAOW KEYS, ALT, SHIFT, and ESC
  if(ev.ctrlKey) $("#board").append("CTRL Key<br>");    //This keys are not supported in this press event.
  if(ev.altKey) $("#board").append("ALT Key<br>");
  if(ev.metaKey) $("#board").append("Meta Key<br>");
  if(ev.shiftKey) $("#board").append("SHIFT key<br>");
    //Each key which provides its ASCII codes
//  ev.preventDefault();
*/
});
});
jQuery.noConflict();
</script>
</head>
<body>

<div id='board' class='boardStyle'>
</div>

</body>
</html>
