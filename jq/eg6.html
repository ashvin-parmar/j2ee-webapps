<!DOCTYPE HTML>
<html>
<head>
<meta charset='utf-8'>
<title>JQuery Selector Example(s)</title>
<script src='jquery/jquery.js'></script>
<style>
.as
{
"color":red;
}
</style>
<script>
$(()=>{
$("li:eq(1)").css("color","red");
$("li:even").css("font-size","20pt");
$("li:odd").css("background","cyan");
$("li:nth-child(4)").css("font-size","30pt");

});
</script>
</head>
<body>

<ui>
<li>Ujjain</li>
<li>Dewas</li>
<li>Delhi</li>
<li>Mumbai</li>
<li>Indore</li>
</ui>
</body>
</html>
