<script>
//Over here the TMJRock Library developer works
function $$$(cei)	//componenetElementId
{
let element=document.getElementById(cei);
if(!element) return null;
return new TMJRockElement(element);
}
function TMJRockElement(element)
{
this.element=element;
this.html=function(content){
if((typeof this.element.innerHTML)=="string")
{
//alert((typeof content)+(content.toString()));
if((typeof content)=="string")
{
this.element.innerHTML=content;
}
if((typeof content)=="number")
{
this.element.innerHTML=content;
}
return this.element.innerHTML;
}
return null;
};
this.value=function(content){
if((typeof this.element.value)=="string")
{
if((typeof content)=="string")
{
this.element.value=content;
}
return this.element.value;
}
return null;
};
}
$$$.ajax=function(jsonObject){
if(jsonObject==null) throw "missing argument in call to ajax";
if(!jsonObject["url"]) throw "url property is missing in call to ajax";
let url=jsonObject["url"];
if((typeof url)!="string") throw "url property is missing in call to ajax";

let methodType="GET";
if(jsonObject["methodType"])
{
methodType=jsonObject["methodType"];
if((typeof methodType)!="string") throw "methodType is of string type in call to ajax";
if(["GET","POST"].includes(methodType)==false) throw "methodType is from GET/POST in call to ajax";
}
let onSuccess=null;
if(jsonObject["success"])
{
onSuccess=jsonObject["success"];
if((typeof onSuccess)!="function") throw "success is of function type in call to ajax";
}

let onFailure=null;
if(jsonObject["failure"])
{
onFailure=jsonObject["failure"];
if((typeof onFailure)!="function") throw "failure is of function type in call to ajax";
}
if(methodType=="GET")
{
let xmlHttpRequest=new XMLHttpRequest();
xmlHttpRequest.onreadystatechange=function(){
if(this.readyState==4)
{
if(this.status==200)
{
let responseData=JSON.parse(this.responseText);
if(onSuccess) onSuccess(responseData);
}
else
{
if(onFailure) onFailure();
}
}
};

if(jsonObject["data"])
{
let jsonData=jsonObject["data"];
let queryString="";
let qsName;
let qsValue;
let x=0;
for(k in jsonData)
{
if(x>0) queryString+="&";
if(x==0) 
{
queryString="?";
x++;
}
qsName=k;
qsValue=jsonData[k];
queryString=queryString+qsName+"="+qsValue;
}
url+=queryString;
}
//alert(url);
xmlHttpRequest.open(methodType,url,true);
xmlHttpRequest.send();
}
if(methodType=="POST")
{
let xmlHttpRequest=new XMLHttpRequest();
xmlHttpRequest.onreadystatechange=function(){
if(this.readyState==4)
{
if(this.status==200)
{
let responseData=JSON.parse(this.responseText);
if(onSuccess) onSuccess(responseData);
}
else
{
if(onFailure) onFailure();
}
}
};
if(jsonObject["jsonData"])
{
let jsonData={};
if(jsonObject["data"])
{
jsonData=jsonObject["data"];
/*
let queryString="";
let qsName;
let qsValue;
let x=0;
for(k in jsonData)
{
if(x>0) queryString+="&";
if(x==0) 
{
queryString="?";
x++;
}
qsName=k;
qsValue=jsonData[k];
queryString=queryString+qsName+"="+qsValue;
}
*/
}
alert(url);
xmlHttpRequest.open(methodType,url,true);
xmlHttpRequest.setRequestHeader("Content-Type","application/json");
xmlHttpRequest.send(JSON.stringify(jsonData));
}
else
{
if(jsonObject["data"])
{
let jsonData=jsonObject["data"];
let queryString="";
let qsName;
let qsValue;
let x=0;
for(k in jsonData)
{
if(x>0) queryString+="&";
if(x==0) 
{
queryString="?";
x++;
}
qsName=k;
qsValue=jsonData[k];
queryString=queryString+qsName+"="+qsValue;
}
url=url+queryString;
}
alert(url);
xmlHttpRequest.open(methodType,url,true);
xmlHttpRequest.send();
}
}
};
//TMJRock Library developer works ends
//TMJRock Library user
function saveEnquiry()
{
let firstName=$$$("firstName").value();
let lastName=$$$("lastName").value();
let age=$$$("age").value();
let customer={
"firstName":firstName,
"lastName":lastName,
"age":age
};
let dataFirstName=$$$("dataFirstName");
let dataLastName=$$$("dataLastName");
let dataAge=$$$("dataAge");
dataFirstName.html("");
dataLastName.html("");
dataAge.html("");		
	//First try [servletThree and jsonData: true] combination -> go with send
	//Then try [servletFour and jsonData: false] combination -> go with queryString
$$$.ajax({
//"url":"servletThree",
//"jsonData":true,
"url":"servletFour",
"methodType":"POST",
"jsonData":false,
"data":customer,
"success":function(responseData){
let cus=responseData;
//alert(JSON.stringify(responseData));
if(cus.firstName!=null) 
{
dataFirstName.html(cus.firstName);
dataLastName.html(cus.lastName);
dataAge.html(cus.age);
}
else
{
/*
dataFirstName.html("");
dataLastName.html("");
dataAge.html("");
*/
alert("Data not found");
}
},
"failure":function(){
alert("Some problem");
}
});
}
