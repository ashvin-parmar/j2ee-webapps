<!DOCTYPE HTML>
<html>
<head>
<meta charset='utf-8'>
<title>Grid Table Feature</title>
<style>
.grid_header_division
{
overflow-x:hidden;
overflow-y:hidden;
width:300px;
}
.grid_head
{
width:750px;
border-collapse:collapse;
}
.grid_pagination_division
{
width:300px;
}
.grid_body_division
{
width:300px;
height:300px;
overflow-x:auto;
overflow-y:auto;
box-sizing:border-box;
scrollbar-width:none;
}
.grid_body
{
width:750px;
border-collapse:collapse;
}
.grid_pagination
{
padding-top:10px;
margin:0px auto;
}

.grid_head td
{
width:50px;
border-spacing:0px;
border-top:1px groove green;
border-right:1px groove green;
border-left:1px groove green;
border-bottom:0px;
text-align:center;
}
.grid_body td
{
width:50px;
border:1px groove green;
border-spacing:0px;
text-align:right;
}
.grid_head td+td
{
width:100px;
}
.grid_body td+td
{
width:100px;
text-align:left;
}
.grid_head td+td+td
{
width:200px;
}
.grid_body td+td+td
{
width:200px;
text-align:left;
}
.grid_head td+td+td+td
{
width:200px;
}
.grid_body td+td+td+td
{
width:200px;
text-align:left;
}

.grid_pagination td
{
text-align:center;
}
.grid_pagination a
{
padding:5px 5px;
background-color:red;
color:white;
text-decoration:none;
}
.someStyle{
border:1px solid black;
width:600px;
height:500px;
}
</style>
<script>
class Student
{
constructor(rollNumber,name,fatherName,city)
{
this.rollNumber=rollNumber;
this.name=name;
this.fatherName=fatherName;
this.city=city;
}
}
function pageNumberChangeHandler(elem,pageNumber)
{
return function(){
elem.setPageNumber(pageNumber);
elem.update();
elem.updatePagination();
}
}
class Grid
{
constructor(gridTableId,gridTableBodyId,gridTablePaginationId,students,pageSize)
{
this.gridTableId=gridTableId;
this.gridTableBodyId=gridTableBodyId;
this.gridTablePaginationId=gridTablePaginationId;
this.students=students;
this.pageSize=pageSize;
this.currentPage=1;
this.paginationControls=5;
this.update();
this.updatePagination();
}
setPageNumber(pageNumber)
{
this.currentPage=pageNumber;
}
update()
{
var gridTableBody=document.getElementById(this.gridTableBodyId);
var startAtIndex=((this.currentPage-1)*this.pageSize);
var endAtIndex=startAtIndex+this.pageSize-1;
var x=1;
var tr,td;
if(endAtIndex>=this.students.length) endAtIndex=this.students.length-1;

while(gridTableBody.rows.length>0) gridTableBody.deleteRow(0);
for(x=startAtIndex;x<=endAtIndex;x++)
{
tr=document.createElement("tr");

td=document.createElement("td");
td.innerHTML=x+1;
tr.appendChild(td);

td=document.createElement("td");
td.innerHTML=this.students[x].rollNumber;
tr.appendChild(td);

td=document.createElement("td");
td.innerHTML=this.students[x].name;
tr.appendChild(td);

td=document.createElement("td");
td.innerHTML=this.students[x].fatherName;
tr.appendChild(td);

td=document.createElement("td");
td.innerHTML=this.students[x].city;
tr.appendChild(td);

gridTableBody.appendChild(tr);
}
}
updatePagination()
{
/*		//Different Way
var endAt=this.paginationControls*((this.currentPage/this.paginationControls)+1);
var startAt=endAt-this.paginationControls;
}
*/
var startAt=((Math.floor((this.currentPage-1)/this.paginationControls))*this.paginationControls)+1;
var endAt=startAt+this.paginationControls-1;
var possiblePageNumbers=this.students.length/this.pageSize;
if(this.students.length%this.pageSize!=0) possiblePageNumbers++;
if(endAt>possiblePageNumbers) 
{
startAt=(possiblePageNumbers-this.paginationControls)<=0?1:Math.floor(possiblePageNumbers-this.paginationControls);
endAt=possiblePageNumbers;
}
var gridTablePagiation=document.getElementById(this.gridTablePaginationId);
var tr,td,x;
var anchor;
while(gridTablePagination.rows.length>0) gridTablePagination.deleteRow(0);
tr=document.createElement("tr");

if(startAt>1)
{
anchor=document.createElement("a");
anchor.href="javascript:void(0)";
anchor.text="prev";
anchor.onclick=pageNumberChangeHandler(this,startAt-1);
td=document.createElement("td");
td.appendChild(anchor);
tr.appendChild(td);
}
x=startAt;
while(x<=endAt)
{
if(x==this.currentPage)
{
td=document.createElement("td");
td.innerHTML="<b>"+x+"</b>";
tr.appendChild(td);
}
else
{
anchor=document.createElement("a");
anchor.href="javascript:void(0)";
anchor.text=x;
anchor.onclick=pageNumberChangeHandler(this,x);
td=document.createElement("td");
td.appendChild(anchor);
tr.appendChild(td);
}
x++;
}
if(endAt<possiblePageNumbers)
{
anchor=document.createElement("a");
anchor.href="javascript:void(0)";
anchor.text="next";
anchor.onclick=pageNumberChangeHandler(this,endAt+1);
td=document.createElement("td");
td.appendChild(anchor);
tr.appendChild(td);
}
gridTablePagination.appendChild(tr);
}
}
var model={
"grid":null
}
function loader()
{
var gridTableHeaderDivision=document.querySelector(".grid_header_division");
var gridTableBodyDivision=document.querySelector(".grid_body_division");
alert(gridTableHeaderDivision);
alert(gridTableBodyDivision);
gridTableBodyDivision.addEventListener('scroll',function(){
//Here are the change to done
gridTableHeaderDivision.scrollLeft=gridTableBodyDivision.scrollLeft;
});
var students=[];
var x;
var student;
for(x=101;x<=2000;x++)
{
student=new Student("A"+x,"Name"+x,"FatherName"+x,"City"+x);
students.push(student);
}
var grid=new Grid("gridTableHead","gridTableBody","gridTablePagination",students,100);
model.grid=grid;
}
window.addEventListener('load',loader);
</script>
</head>
<body>
<div class='someStyle'>
<div class='grid_header_division'>
<table class='grid_head' id='gridTableHead'>
<tr>
<td>S.No.</td>
<td>Roll Number</td>
<td>Name</td>
<td>Father Name</td>
<td>City</td>
</tr>
</table>
</div>
<div class='grid_body_division'>
<table class='grid_body' id='gridTableBody'>
</table>
</div>
<div class='grid_pagination_division' >
<table class='grid_pagination' id='gridTablePagination'>
</table>
</div>
</div>
</body>
</html>
