$$$.ajax=function(jsonObject){
if(jsonObject==null) throw "missing argument in call to ajax";
if(!jsonObject["url"]) throw "url property is missing in call to ajax";
let url=jsonObject["url"];
if((typeof url)!="string") throw "url property is missing in call to ajax";

let methodType="GET";
if(jsonObject["methodType"])
{
methodType=jsonObject["methodType"];
if((typeof methodType)!="string") throw "methodType is of string type in call to ajax";
if(["GET","POST"].includes(methodType)==false) throw "methodType is from GET/POST in call to ajax";
}
let onSuccess=null;
if(jsonObject["success"])
{
onSuccess=jsonObject["success"];
if((typeof onSuccess)!="function") throw "success is of function type in call to ajax";
}

let onFailure=null;
if(jsonObject["failure"])
{
onFailure=jsonObject["failure"];
if((typeof onFailure)!="function") throw "failure is of function type in call to ajax";
}
if(methodType=="GET")
{
let xmlHttpRequest=new XMLHttpRequest();
xmlHttpRequest.onreadystatechange=function(){
if(this.readyState==4)
{
if(this.status==200)
{
let responseData=JSON.parse(this.responseText);
if(onSuccess) onSuccess(responseData);
}
else
{
if(onFailure) onFailure();
}
}
};
if(jsonObject["data"])
{
let jsonData=jsonObject["data"];
let queryString="";
let qsName;
let qsValue;
let x=0;
for(k in jsonData)
{
if(x>0) queryString+="&";
if(x==0) 
{
queryString="?";
x++;
}
qsName=k;
qsValue=jsonData[k];
queryString=queryString+qsName+"="+qsValue;
}
url+=queryString;
}
//alert(url);
xmlHttpRequest.open(methodType,url,true);
xmlHttpRequest.send();
}
if(methodType=="POST")
{
let xmlHttpRequest=new XMLHttpRequest();
xmlHttpRequest.onreadystatechange=function(){
if(this.readyState==4)
{
if(this.status==200)
{
let responseData=JSON.parse(this.responseText);
if(onSuccess) onSuccess(responseData);
}
else
{
if(onFailure) onFailure();
}
}
};
let jsonData={};
let queryString="";
let sendJSON=jsonObject["sendJSON"];
if(!sendJSON) sendJSON=false;
if((typeof sendJSON)!="boolean") throw "sendJSON property should be of boolean type in call to ajax";
if(jsonObject["data"])
{
jsonData=jsonObject["data"];
}
xmlHttpRequest.open(methodType,url,true);
if(sendJSON)
{
xmlHttpRequest.setRequestHeader("Content-Type","application/json");
xmlHttpRequest.send(JSON.stringify(jsonData));
}
else
{
let qsName;
let qsValue;
let x=0;
for(k in jsonData)
{
if(x>0) queryString+="&";
if(x==0) 
{
//queryString="?";
x++;
}
qsName=k;
qsValue=jsonData[k];
queryString=queryString+qsName+"="+qsValue;
}
//url=url+queryString;
xmlHttpRequest.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
xmlHttpRequest.send(queryString);
}
}
};
