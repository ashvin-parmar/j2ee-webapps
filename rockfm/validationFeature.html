<!DOCTYPE HTML>
<html>
<head>
<meta charset='utf-8'>
<title>AJAX Example</title>
<script>
//ROCK-FM library part starts here

//ROCK-FM library part ends here
//USER declarations for validating what?

function doSomething()
{
return $$$.isValid({
"nm":{
"required":true,
"input-size":20,
"error-pane":"nmErrorSection",
"errors":{
"required":"Name required",
"input-size":"Name cannot longer than 20 characters"
}
},
"ad":{
"required":true,
"error-pane":"adErrorSection",
"errors":{
"required":"Address required"
}
},
"ct":{
"invalid":-1,
"error-pane":"ctErrorSection",
"errors":{
"invalid":"Select city"
}
},
"gender":{
"required":true,
"error-pane":"genderErrorSection",
"errors":{
"required":"Select gender"
}
},
"agree":{
"required-state":true,
"display-alert":true,
"error":{
"required-state":"Select: I agree checkbox"
}
}
});
}
</script>
</head>
<body>
<h2>ROCK-FM Validation Feature</h2>
<form id='someForm' action='whatever' onclick='return doSomething()'>

Name: <input type='text' id='nm' name='nm'>
<span id='nmErrorSection'></span><br>

Address: <span id='adErrorSection'></span><br>
<textarea id='ad' name='ad'>

</textarea><br>


City: <select id='ct' name='ct'>
<option value='-1'>Select city</option>
<option value='1'>Indore</option>
<option value='2'>Ujjain</option>
<option value='3'>Bhopal</option>
</select>
<span id='ctErrorSection'></span><br>

Gender: &nbsp;&nbsp;&nbsp;
<input type='radio' id='ml' name='gender'> &nbsp;&nbsp;&nbsp;
<input type='radio' id='fe' name='gender'> &nbsp;&nbsp;&nbsp;
<span id='genderErrorSection'> </span><br>

Agree: <input type='checkbox' id='ag' name='ag' value='Y'><br>

<button type='submit'>Register</button>
</form>

</body>
</html>
