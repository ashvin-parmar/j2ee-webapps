<!DOCTYPE HTML>

<script>
//ROCK-FM library part starts here
function $$$()
{

}
$$$.validateRequired=function(value)
{
//alert(value);
if(value==null || value.trim().length<=0) return false;
return true;
};
$$$.validateInputSize=function(value,inputSize)
{
if(value==null || value.trim().length>inputSize) return false;
return true;
};
$$$.checkInvalid=function(value,invalid)
{
if(value==null) return false;
return value.trim()==invalid;
};
$$$.validate=function(domObj,obj)
{
if(domObj==null) return false;
var value=domObj.value;
var valid=true;
if(obj.required && $$$.validateRequired(value)==false)
{
valid=false;
errorSection=document.getElementById(obj["error-pane"]);
errorSection.innerHTML=obj.errors.required;
}
else if(obj["input-size"]!=null && $$$.validateInputSize(value,obj["input-size"])==false)
{
valid=false;
errorSection=document.getElementById(obj["error-pane"]);
errorSection.innerHTML=obj.errors["input-size"];
}
else if(obj.invalid!=null && $$$.checkInvalid(value,obj.invalid))
{
valid=false;
errorSection=document.getElementById(obj["error-pane"]);
errorSection.innerHTML=obj.errors.invalid;
}
else if(obj["required-state"]!=null && (obj["required-state"]!=domObj.checked))
{
valid=false;
if(obj["display-alert"]) alert(obj.errors["required-state"]);
}
return valid;
};
$$$.isValid=function(objs)
{
var keys=Object.keys(objs);
var obj;
var objKeys=[];
var domObjs=[];
var domObj;
var errorDomObj
var valid=true;
var x;
var firstInvalid=null;
for(var i=0;i<keys.length;i++)
{
domObjs=document.getElementsByName(keys[i]);
obj=objs[keys[i]];
errorDomObj=null;
if(obj["error-pane"]) (errorDomObj=document.getElementById(obj["error-pane"])).innerHTML="";
if(domObjs.length==1)
{
domObj=domObjs[0];
x=$$$.validate(domObj,obj);
}
else
{
var isChecked=false;
for(var j=0;j<domObjs.length;j++)
{
domObj=domObjs[j];
if(domObj.checked)
{
isChecked=true;
break;
}
}
if(!isChecked)
{
if(errorDomObj) 
{
errorDomObj.innerHTML=obj.errors["required"];
}
valid=false;
}
}
if(valid) valid=x;
}
return valid;
};
//ROCK-FM library part ends here
