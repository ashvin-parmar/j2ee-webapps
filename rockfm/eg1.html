<!DOCTYPE html>
<html>
<head>
<title>ROCKFM Example</title>
<meta charset='utf-8'>
</head>
<body>
<h3>Learning GET request sending without parameters using java-script</h3>
<b>Designations:</b>&nbsp;&nbsp;
<select id='designations' name='designations'></select><br>
<br>
<a href='index.html'>HOME</a>
</body>
</html>
<script>
function $$$(arg)
{
var element=document.getElementById(arg);
return element;
}
var elem="designations";
$$$(elem).fillComboBox=function(data){
var comboBox=document.getElementById(elem);
var value=data.value;
var text=data.text;
var dataSource=data.dataSource;
var firstOption=data.firstOption;
var obj;
if(firstOption!=null)
{
obj=document.createElement("option");
obj.value=firstOption.value;
obj.innerHTML=firstOption.text;
comboBox.append(obj);
}
for(var i=0;i<dataSource.length;i++)
{
obj=document.createElement("option");
obj.value=dataSource[i][value];
obj.innerHTML=dataSource[i][text];
comboBox.append(obj)
}
};

$$$.ajax=function(a){
//alert(a.url);
//alert(a.methodType);
//alert(a.success);
//alert(a.failure);
var xmlHttpRequest=new XMLHttpRequest();
xmlHttpRequest.onreadystatechange=function(){
if(this.readyState==4)
{
if(this.status==200)
{
a.success(this.responseText);
}
else
{
a.failure();
}
}
};
xmlHttpRequest.open(a.methodType,a.url,true);
xmlHttpRequest.send();
};

function populateDesignations()
{
$$$.ajax({
"url":"servletOne",
"methodType":"GET",
"success":function(responseText){
var designations=JSON.parse(responseText);
$$$("designations").fillComboBox({
"dataSource":designations,
"text":"title",
"value":"code",
"firstOption":{
"text":"< Select Option >",
"value":"-1"
}
});
},
"failure":function(){
alert("Some problem");
}
});
}
window.addEventListener('load',populateDesignations);
</script>
