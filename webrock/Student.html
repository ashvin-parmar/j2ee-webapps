function masterPageHeaderDIVJS()
{
$("#headerLogoImage").addClass("headerLogoImage");

my:"left center"
});
$("#headerHomeButton").position({
my:"left center"
});

var $headerMenuDivChilds=$("#headerMenuDivision").children();

//alert($(value).html());

var url=$(value).attr('href');
//alert(url.substring(1)+"JS");

//alert($(url).html());

{

{

}
});

});
$("#toggleThemeButton").click(function(){
var $elem=$(this).children().eq(0);
if($elem.attr("src")=="sun.svg") 
{
//more related to theme change
$elem.attr("src","moon.svg");
}
else 
{
//more related to theme change
$elem.attr("src","sun.svg");
}
$elem.fadeIn(500);
});

function addStudentDIVJS()
{
var studentManager=new StudentDAO();
$("#addStudentDIV #addStudentButton").click(function(){
var $addButton=$(this);
$addButton.prop('disable',true);
var name=$("#addStudentDIV #name").val();
var rollNumber=0;
var gender=$("#addStudentDIV input[name='gender']:checked").val();
//alert(name+", "+rollNumber+", "+gender);
var student=new StudentDTO(rollNumber,name,gender);

let addStudentPromise=studentManager.add(student);
if(addStudentPromise!=null)
{
addStudentPromise
.then((response)=>{
if(response.error)
{
alert(response.error);
$("#addStudentForm #errorSection").html(response.error);
}
else
{
$("#addStudentForm").load("componentsStudent.html #addStudentDIV #addStudentMessage",function(){
$("#addStudentMessage").fadeIn('slow');
onClickEventHandlerUsingHREF("#addStudentMessage #noButton");
onClickEventHandlerUsingHREF("#addStudentMessage #yesButton");
});
}
},(err)=>{
$addButton.removeAttr('disabled');
alert("Error: "+JSON.stringify(err));
var error=JSON.stringify(err);
$("#lMidBodyDivision").load("/webrock/404.html");
});
}
});
onClickEventHandlerUsingHREF("#addStudentDIV #homeButton");
}

function getAllDIVJS()
{
var studentManager=new StudentDAO();

let getStudentPromise=studentManager.getAll();
if(getStudentPromise!=null)
{
getStudentPromise.then((response)=>{
if(response.error)
{
alert(response.error);
}
else
{
var $studentsTbody=$("#studentsDataTable table tbody");
var rowTemplate;
var colTemplate;
var rollNumber;
var name;
var gender;
var i=0;
for(let student of response)
{
rollNumber=student.rollNumber;
name=student.name;
gender=student.gender;
//alert(rollNumber+name+gender);
rowTemplate=$("<tr>");
colTemplate=$("<td>");
colTemplate.css("text-align","right");
colTemplate.html(++i);
rowTemplate.append(colTemplate);
colTemplate=$("<td>");
colTemplate.css("text-align","left");
colTemplate.html(student.rollNumber);
rowTemplate.append(colTemplate);
colTemplate=$("<td>");
colTemplate.css("text-align","left");
colTemplate.html(student.name);
rowTemplate.append(colTemplate);
colTemplate=$("<td>");
colTemplate.css("text-align","left");
colTemplate.html(student.gender);
rowTemplate.append(colTemplate);
$studentsTbody.append(rowTemplate);
}
$("#getAllDIV table").fadeIn('slow');
}
},(err)=>{
alert("Error: "+JSON.stringify(err));
var error=JSON.stringify(err);
$("#lMidBodyDivision").load("/webrock/404.html");
});
}
onClickEventHandlerUsingHREF("#getAllDIV #homeButton");
}

function updateStudentDIVJS()
{
var studentManager=new StudentDAO();
$("#updateStudentDIV #updateStudentButton").click(function(){
var $updateButton=$(this);
$updateButton.prop('disable',true);
var name=$("#updateStudentDIV #name").val();
var rollNumber=$("#updateStudentDIV #rollNumber").val();
var gender=$("#updateStudentDIV input[name='gender']:checked").val();
//alert(name+", "+rollNumber+", "+gender);
var student=new StudentDTO(rollNumber,name,gender);

let updateStudentPromise=studentManager.update(student);
if(updateStudentPromise!=null)
{
updateStudentPromise
.then((response)=>{
if(response.error!=null)
{
alert(response.error);
$("#updateStudentForm #errorSection").html(response.error);
}else
{
$("#updateStudentForm").load("componentsStudent.html #updateStudentDIV #updateStudentMessage",function(){
$("#updateStudentMessage").fadeIn('slow');
onClickEventHandlerUsingHREF("#updateStudentMessage #noButton");
onClickEventHandlerUsingHREF("#updateStudentMessage #yesButton");
});
}
},(err)=>{
$updateButton.removeAttr('disabled');
alert("Error: "+JSON.stringify(err));
$("#lMidBodyDivision").html(err.message);
//$("#lMidBodyDivision").load("/webrock/404.html");
});
}
});
onClickEventHandlerUsingHREF("#updateStudentDIV #homeButton");
}


function onClickEventHandlerUsingHREF(value)
{
$(value).click(function(){
//alert("over here, home button event");
var url=$(value).attr('href');
//alert(url.substring(1)+"JS");
$("#lMidBodyDivision").load("componentsStudent.html "+url,function(response,status,xhr){
//alert($(url).html());
if(status=="error")
{
$(this).load("404.html");
}
else
{
$(url).fadeIn('slow');
window[url.substring(1)+"JS"]();   //calling its method
}
});
});
}
