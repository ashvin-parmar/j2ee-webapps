<!DOCTYPE html>
<html lang='en'>
<head>
<title>AJAX Examples</title>
<meta charset='utf-8'>
<script>
class Student
{
constructor(name,rollNumber)
{
this.rollNumber=rollNumber;
this.name=name;
}
}
function addStudent()
{
var rollNumber=document.getElementById("rollNumber").value.trim();
var name=document.getElementById("name").value.trim();
var student=new Student(name,rollNumber);
alert(rollNumber+" "+name);

var whatever=document.getElementById("errorSection");
var xmlHttpRequest=new XMLHttpRequest();
xmlHttpRequest.onreadystatechange=function()
{
if(this.readyState==4)
{
if(this.status==200)
{
var responseData=JSON.parse(this.responseText!=null?this.responseText:"{}");
var data=responseData;
alert(data);
//alert(typeof data.data);
if(responseData.error) whatever.innerHTML=data;
else working.innerHTML=data;
}
else
{
alert("Some problem");
}
}
};
//xmlHttpRequest.open("POST","requestParameterTesting/testing1",true);    //for testing the case of sending json with with having more than one parameter as unknown  [Required no json data to process - WORKING]
//xmlHttpRequest.open("POST","requestParameterTesting/testing3",true);  //for testing the case of sending json with having @RequestParameter on parmaeter field, cannot set from json-data. [NOT-WORKING]
xmlHttpRequest.open("POST","requestParameterTesting/testing4",true);    //Actual implementing for json to object for that one parameter only [WORKING]
//xmlHttpRequest.open("POST","requestParameterTesting/testing5",true);    //Testing for no argument required [WORKING]


//xmlHttpRequest.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
xmlHttpRequest.setRequestHeader("Content-Type","application/json; charset=UTF-8");
//xmlHttpRequest.send();
xmlHttpRequest.send(JSON.stringify(student));
}
</script>
</head>
<body>
<h3 >Student</h3>
<div id='addStudentPanel' >
<form id='studentAddForm' style='width:500px;margin:5px;'>
Roll Number: &nbsp;
<input id='rollNumber' name='rollNumber' type='text' required><br>
Name: &nbsp;
<input id='name' name='name' type='text' required><br>
<span id='errorSection' style='color:red;'></span><br>
<button type='button' id='addStudentButton' onclick=javascript:addStudent()>Add Student</button><br>
</form>
<span id='working'></span><br>
<br>
<a href='/webrock/index.html'>Home</a><br>
</div>
</body>
</html>
